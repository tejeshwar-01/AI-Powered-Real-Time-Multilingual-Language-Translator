<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InstantTranslate AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6366f1;
    --primary-glow: rgba(99,102,241,.4);
    --bg:#020617;
    --glass:rgba(255,255,255,.03);
    --glass-border:rgba(255,255,255,.1);
    --text-main:#f8fafc;
    --text-dim:#94a3b8;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,sans-serif;
    background:radial-gradient(circle at top right,#1e1b4b,#020617);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.app-container{
    width:95%;
    max-width:1000px;
    background:var(--glass);
    backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    border-radius:24px;
    padding:32px;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.6);
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.logo{
    font-size:1.5rem;
    font-weight:600;
    background:linear-gradient(to right,#818cf8,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.status{font-size:12px;color:var(--text-dim)}
.controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
select,button{
    padding:12px 18px;
    border-radius:12px;
    border:1px solid var(--glass-border);
    background:#1e293b;
    color:white;
    font-size:14px;
    cursor:pointer;
}
button.primary{
    background:var(--primary);
    border:none;
    font-weight:600;
}
button.stop{background:#ef4444}
.main-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}
.pane{display:flex;flex-direction:column}
.input-area{
    background:rgba(0,0,0,.25);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:16px;
    min-height:220px;
    position:relative;
}
textarea{
    width:100%;
    height:120px;
    background:transparent;
    border:none;
    color:white;
    font-size:16px;
    resize:none;
    outline:none;
}
.output-text{
    font-size:16px;
    line-height:1.6;
    color:#e2e8f0;
}
.voice-wave{
    display:none;
    align-items:center;
    gap:4px;
    height:30px;
}
.voice-wave span{
    width:3px;
    height:10px;
    background:var(--primary);
    border-radius:3px;
    animation:wave 1s infinite ease-in-out;
}
.voice-wave span:nth-child(2){animation-delay:.1s}
.voice-wave span:nth-child(3){animation-delay:.2s}
@keyframes wave{
    0%,100%{height:8px}
    50%{height:26px}
}
.meta-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
}
progress{
    width:120px;
    height:6px;
}
.hidden{display:none!important}
@media(max-width:768px){
    .main-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app-container">
<header>
    <div class="logo">🌍 InstantTranslate AI</div>
    <div class="status" id="status">● Ready</div>
</header>

<div class="controls">
    <select id="modeSelect">
        <option value="text">Text Mode</option>
        <option value="voice">Real-Time Voice</option>
    </select>

    <select id="langSelect">
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ta">Tamil</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
    </select>
</div>

<div class="main-grid">
<div class="pane">

<div class="input-area">
<!-- TEXT -->
<div id="textSection">
    <textarea id="textInput" placeholder="Type text here..."></textarea>
    <button class="primary" id="translateTextBtn">Translate</button>
</div>

<!-- VOICE -->
<div id="voiceSection" class="hidden" style="text-align:center">
    <p id="inputDisplay" style="color:var(--text-dim)">Microphone ready...</p>

    <div class="voice-wave" id="waveAnim">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div style="margin-top:30px;display:flex;gap:12px;justify-content:center">
        <button class="primary" id="startBtn">Start Listening</button>
        <button class="stop" id="stopBtn" disabled>Stop</button>
    </div>
</div>
</div>
</div>

<div class="pane">
<div class="input-area" style="background:rgba(99,102,241,.06)">
    <div id="outputDisplay" class="output-text">
        Your translation will appear here...
    </div>

    <div id="loading" class="hidden" style="position:absolute;top:10px;right:12px">
        ⌛
    </div>

    <div class="meta-info" style="position:absolute;bottom:14px;left:16px;right:16px">
        <span id="detectedLang" style="font-size:12px;color:var(--text-dim)">
            Detected: —
        </span>
        <progress id="confidenceBar" value="0" max="1"></progress>
    </div>
</div>
</div>
</div>
</div>

<!-- ================= JS ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

let socket=null,audioContext=null,processor=null,micStream=null;

const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const modeSelect=document.getElementById("modeSelect");
const langSelect=document.getElementById("langSelect");
const textInput=document.getElementById("textInput");

const inputDisplay=document.getElementById("inputDisplay");
const outputDisplay=document.getElementById("outputDisplay");
const detectedLang=document.getElementById("detectedLang");
const confidenceBar=document.getElementById("confidenceBar");
const loading=document.getElementById("loading");

function animateConfidence(value){
    confidenceBar.value=0;
    let c=0,step=value/15;
    const anim=setInterval(()=>{
        c+=step;
        confidenceBar.value=c;
        if(c>=value)clearInterval(anim);
    },16);
}

function initSocket(){
    if(socket && socket.readyState===WebSocket.OPEN) return;
    socket=new WebSocket(
        `${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws/stream`
    );
    socket.onopen=()=>{
        socket.send(JSON.stringify({type:"config",lang:langSelect.value}));
    };
    socket.onmessage=e=>{
        const d=JSON.parse(e.data);
        loading.classList.add("hidden");
        inputDisplay.innerText=d.original||"—";
        detectedLang.innerText=`Detected: ${(d.source_lang||"en").toUpperCase()}`;
        outputDisplay.innerText=d.translated||"—";
        animateConfidence(d.confidence??1);
    };
}

modeSelect.onchange=()=>{
    document.getElementById("voiceSection")
        .classList.toggle("hidden",modeSelect.value!=="voice");
    document.getElementById("textSection")
        .classList.toggle("hidden",modeSelect.value==="voice");
};

document.getElementById("translateTextBtn").onclick=()=>{
    if(!textInput.value.trim())return;
    initSocket();
    loading.classList.remove("hidden");
    socket.send(JSON.stringify({
        type:"text_translate",
        text:textInput.value.trim(),
        lang:langSelect.value
    }));
};

startBtn.onclick=async()=>{
    initSocket();
    startBtn.disabled=true;
    stopBtn.disabled=false;

    audioContext=new AudioContext({sampleRate:16000});
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});

    const source=audioContext.createMediaStreamSource(micStream);
    processor=audioContext.createScriptProcessor(1024,1,1);

    processor.onaudioprocess=e=>{
        if(!socket||socket.readyState!==1)return;
        const input=e.inputBuffer.getChannelData(0);
        const pcm=new Int16Array(input.length);
        for(let i=0;i<input.length;i++){
            pcm[i]=Math.max(-1,Math.min(1,input[i]))*0x7fff;
        }
        socket.send(pcm.buffer);
    };

    source.connect(processor);
    processor.connect(audioContext.destination);
};

stopBtn.onclick=()=>{
    startBtn.disabled=false;
    stopBtn.disabled=true;
    processor?.disconnect();
    micStream?.getTracks().forEach(t=>t.stop());
};

});
</script>

</body>
</html>
